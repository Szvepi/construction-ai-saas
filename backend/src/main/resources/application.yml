spring:
  application:
    name: buildassist-email-api
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
          # Alacsony hőmérséklet (temperature), mert precíz adatkinyerést várunk, nem kreativitást!
          temperature: 0.2
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/mira_dev}
    username: ${DATABASE_USERNAME:buildassist}
    password: ${DATABASE_PASSWORD:buildassist}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - openid
              - email
              - profile
            redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}
            client-name: Google
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v1/userinfo
            user-info-authentication-method: header
            user-name-attribute: email

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: INFO
    com.buildassist.service.GmailInboxSyncService: INFO
    com.buildassist.service.GmailSyncScheduler: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  show-actuator: false

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production}
    expiry-hours: 24
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  encryption:
    aes-key: ${TOKEN_ENCRYPTION_KEY:}
  gmail:
    client-id: ${GMAIL_CLIENT_ID:}
    client-secret: ${GMAIL_CLIENT_SECRET:}
    redirect-uri: ${GMAIL_REDIRECT_URI:http://localhost:8080/api/gmail/callback}
    sync-window-months: ${GMAIL_SYNC_WINDOW_MONTHS:6}
    quota-project-key: ${GMAIL_QUOTA_PROJECT_KEY:default}
    project-quota-units-per-minute: ${GMAIL_PROJECT_QUOTA_UNITS_PER_MINUTE:1200000}
    user-quota-units-per-minute: ${GMAIL_USER_QUOTA_UNITS_PER_MINUTE:6000}
    quota-safety-margin: ${GMAIL_QUOTA_SAFETY_MARGIN:0.2}
    max-concurrent-requests-per-account: ${GMAIL_MAX_CONCURRENT_REQUESTS_PER_ACCOUNT:1}
    sync-poll-interval-ms: ${GMAIL_SYNC_POLL_INTERVAL_MS:30000}
    retry-base-delay-seconds: ${GMAIL_RETRY_BASE_DELAY_SECONDS:5}
    retry-max-delay-seconds: ${GMAIL_RETRY_MAX_DELAY_SECONDS:900}
    retry-max-attempts: ${GMAIL_RETRY_MAX_ATTEMPTS:8}
    list-quota-units: ${GMAIL_LIST_QUOTA_UNITS:5}
    get-metadata-quota-units: ${GMAIL_GET_METADATA_QUOTA_UNITS:20}
    get-full-quota-units: ${GMAIL_GET_FULL_QUOTA_UNITS:60}
    history-quota-units: ${GMAIL_HISTORY_QUOTA_UNITS:2}
    profile-quota-units: ${GMAIL_PROFILE_QUOTA_UNITS:1}
    draft-create-quota-units: ${GMAIL_DRAFT_CREATE_QUOTA_UNITS:10}
  openai:
    api-key: ${OPENAI_API_KEY:}
  email-classification:
    enabled: ${EMAIL_CLASSIFICATION_ENABLED:true}
    version: ${EMAIL_CLASSIFICATION_VERSION:v1}
    max-per-run: ${EMAIL_CLASSIFICATION_MAX_PER_RUN:5}
    max-per-day: ${EMAIL_CLASSIFICATION_MAX_PER_DAY:100}
    max-reclassification-batch: ${EMAIL_CLASSIFICATION_MAX_RECLASSIFICATION_BATCH:100}
    max-attempts: ${EMAIL_CLASSIFICATION_MAX_ATTEMPTS:3}
    retry-base-seconds: ${EMAIL_CLASSIFICATION_RETRY_BASE_SECONDS:300}
    stale-processing-minutes: ${EMAIL_CLASSIFICATION_STALE_PROCESSING_MINUTES:10}
    poll-interval-ms: ${EMAIL_CLASSIFICATION_POLL_INTERVAL_MS:30000}
    max-body-characters: ${EMAIL_CLASSIFICATION_MAX_BODY_CHARACTERS:12000}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
